<!DOCTYPE html>
<html>
<head>
    <title>grid-column and grid-row Example</title>

    <style>

        .container{
            display:grid;
            grid-template-columns:150px 150px 150px;
            grid-template-rows:100px 100px 100px;
            gap:10px;
            background:lightgray;
            padding:10px;
        }

        .container div{
            background:skyblue;
            border:1px solid black;
            text-align:center;
            font-size:20px;
            padding:35px;
        }

        /* Item 1 occupies two columns */
        .item1{
            grid-column:1/3;
            background:orange;
        }

        /* Item 5 occupies two rows */
        .item5{
            grid-row:2/4;
            background:tomato;
            color:white;
        }

    </style>

</head>

<body>

<h2 align="center">grid-column and grid-row Example</h2>

<div class="container">

    <div class="item1">1</div>
    <div>2</div>
    <div>3</div>
    <div class="item5">5</div>
    <div>4</div>
    <div>6</div>
    <div>7</div>

</div>

</body>
</html>
