<!DOCTYPE html>
<html>
<head>
<style>
.container{
    display: grid;
    grid-template-columns: 100px 100px 100px;
    gap: 10px;
}

.item1{
    background: red;
    padding: 20px;
    grid-column: 1/2;
}

.container div{
    background: lightblue;
    padding: 20px;
    text-align: center;
    border: 1px solid black;
}
</style>
</head>

<body>

<div class="container">
    <div class="item1">1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
</div>

</body>
</html>
